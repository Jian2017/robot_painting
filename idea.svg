```svg
<svg width="1800" height="1000" viewBox="0 0 1800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 44px Arial; fill: #1f2a44; }
      .subtitle { font: 24px Arial; fill: #444; }
      .sectionTitle { font: bold 28px Arial; fill: white; }
      .boxTitle { font: bold 20px Arial; fill: #1f2a44; }
      .body { font: 16px Arial; fill: #333; }
      .small { font: 14px Arial; fill: #555; }
      .math { font: italic 24px Times New Roman; fill: #222; }
      .panel { fill: #fafafa; stroke: #d0d7e2; stroke-width: 2; rx: 18; }
      .stepBlue { fill: #2f66d0; }
      .stepPurple { fill: #7a45c2; }
      .card { fill: white; stroke: #d7dce5; stroke-width: 1.5; rx: 14; }
      .arrow { stroke: #555; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f7fb"/>

  <text x="900" y="70" text-anchor="middle" class="title">
    Painting Robot Brain: From Stroke Learning to Intelligent Painting
  </text>
  <text x="900" y="110" text-anchor="middle" class="subtitle">
    A Two-Step System: Learn How to Draw Each Stroke → Decide What to Paint Next
  </text>

  <!-- LEFT PANEL -->
  <rect x="40" y="150" width="840" height="780" class="panel"/>
  <rect x="60" y="170" width="140" height="50" rx="12" class="stepBlue"/>
  <text x="130" y="203" text-anchor="middle" class="sectionTitle">STEP 1</text>

  <text x="230" y="205" class="boxTitle" style="font-size:34px;">
    Stroke Trainer
  </text>
  <text x="230" y="235" class="body">
    Learn the basic motor skills by minimizing stroke execution error.
  </text>

  <rect x="70" y="270" width="780" height="100" class="card"/>
  <text x="100" y="320" class="math">
    min || stroke_observed - f(θ, stroke_planned) ||
  </text>
  <text x="100" y="350" class="small">
    Robot learns force, angle, timing, paint loading, and dynamics.
  </text>

  <!-- Flow cards -->
  <rect x="70" y="410" width="170" height="220" class="card"/>
  <text x="90" y="450" class="boxTitle">1 THINK</text>
  <path d="M100 560 C150 470, 190 620, 220 500" stroke="#356ad2" stroke-width="6" fill="none"/>
  <text x="90" y="600" class="body">Ideal planned stroke</text>

  <rect x="270" y="410" width="170" height="220" class="card"/>
  <text x="290" y="450" class="boxTitle">2 EXECUTE</text>
  <circle cx="355" cy="525" r="55" fill="#eceff5" stroke="#aaa"/>
  <text x="300" y="610" class="body">Robot arm paints</text>

  <rect x="470" y="410" width="170" height="220" class="card"/>
  <text x="490" y="450" class="boxTitle">3 OBSERVE</text>
  <path d="M500 560 C550 470, 590 620, 620 500" stroke="#e58b1f" stroke-width="6" fill="none"/>
  <text x="505" y="600" class="body">Camera sees result</text>

  <rect x="670" y="410" width="170" height="220" class="card"/>
  <text x="690" y="450" class="boxTitle">4 LEARN</text>
  <path d="M720 510 C760 470, 790 550, 810 500" stroke="#356ad2" stroke-width="4" fill="none"/>
  <path d="M720 560 C760 520, 790 600, 810 550" stroke="#e58b1f" stroke-width="4" fill="none"/>
  <text x="690" y="610" class="body">Update θ by gradient</text>

  <line x1="240" y1="520" x2="270" y2="520" class="arrow"/>
  <line x1="440" y1="520" x2="470" y2="520" class="arrow"/>
  <line x1="640" y1="520" x2="670" y2="520" class="arrow"/>

  <rect x="70" y="690" width="770" height="180" class="card"/>
  <text x="100" y="730" class="boxTitle">Key Idea</text>
  <text x="100" y="770" class="body">
    Learn low-level brush control first.
  </text>
  <text x="100" y="805" class="body">
    Similar to motor learning / calibration.
  </text>
  <text x="100" y="840" class="body">
    Generalizes across tools, surfaces, and paints.
  </text>

  <!-- RIGHT PANEL -->
  <rect x="920" y="150" width="840" height="780" class="panel"/>
  <rect x="940" y="170" width="140" height="50" rx="12" class="stepPurple"/>
  <text x="1010" y="203" text-anchor="middle" class="sectionTitle">STEP 2</text>

  <text x="1110" y="205" class="boxTitle" style="font-size:34px;">
    Painter Brain
  </text>
  <text x="1110" y="235" class="body">
    Understand the scene, artistic taste, and plan meaningful strokes.
  </text>

  <rect x="950" y="270" width="780" height="100" class="card"/>
  <text x="980" y="320" class="body" style="font-size:24px;">
    Agentic VLM + Planning + Human-in-the-loop Artistic Guidance
  </text>
  <text x="980" y="350" class="small">
    Produces semantic stroke plans instead of raw pixels.
  </text>

  <rect x="950" y="410" width="150" height="220" class="card"/>
  <text x="970" y="450" class="boxTitle">1 SEE</text>
  <rect x="985" y="490" width="80" height="80" fill="#dbe6ff" stroke="#888"/>
  <text x="975" y="610" class="body">Camera image</text>

  <rect x="1130" y="410" width="150" height="220" class="card"/>
  <text x="1150" y="450" class="boxTitle">2 UNDERSTAND</text>
  <circle cx="1205" cy="530" r="42" fill="#eef1f6" stroke="#aaa"/>
  <text x="1150" y="610" class="body">Scene + style</text>

  <rect x="1310" y="410" width="150" height="220" class="card"/>
  <text x="1330" y="450" class="boxTitle">3 PLAN</text>
  <path d="M1335 530 C1360 500, 1400 560, 1430 510" stroke="#356ad2" stroke-width="4" fill="none"/>
  <path d="M1335 570 C1360 540, 1400 600, 1430 550" stroke="#e58b1f" stroke-width="4" fill="none"/>
  <text x="1330" y="610" class="body">Feature strokes</text>

  <rect x="1490" y="410" width="150" height="220" class="card"/>
  <text x="1510" y="450" class="boxTitle">4 REFLECT</text>
  <text x="1510" y="520" class="body">Compare intent</text>
  <text x="1510" y="555" class="body">with canvas</text>
  <text x="1510" y="610" class="body">Adapt strategy</text>

  <line x1="1100" y1="520" x2="1130" y2="520" class="arrow"/>
  <line x1="1280" y1="520" x2="1310" y2="520" class="arrow"/>
  <line x1="1460" y1="520" x2="1490" y2="520" class="arrow"/>

  <rect x="950" y="690" width="770" height="180" class="card"/>
  <text x="980" y="730" class="boxTitle">Human + AI Collaboration</text>
  <text x="980" y="770" class="body">
    Human can intervene in the loop: artistic taste, edits, emphasis.
  </text>
  <text x="980" y="805" class="body">
    A good harmony between silicon and carbon.
  </text>
  <text x="980" y="840" class="body">
    Robot becomes an adaptive creative partner instead of a printer.
  </text>
</svg>
```

Save this as `painting_robot_brain.svg`. SVG is vector-based, so it can be zoomed infinitely without becoming blurry. Perfect for GitHub Gist, posters, and competition submissions.
